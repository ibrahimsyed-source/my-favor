# Render Blueprint for the My Favor API.
# In Render: New ▸ Blueprint ▸ connect this repo. Render reads this file, creates
# the web service, then prompts you for the `sync: false` values in the dashboard.
# Docs: https://render.com/docs/blueprint-spec
#
# DATABASE: the app uses SUPABASE Postgres (project xhdhhanmqtrnblequgiy) — NOT a
# Render-managed database. An earlier revision of this file provisioned a free
# Render Postgres and wired DATABASE_URL to it via `fromDatabase`; that DB went
# away, every boot crashed with Prisma P1001, and Render auto-suspended the
# service. Do NOT re-add a `databases:` block here.
#
# IMPORTANT — connecting to Supabase from Render requires the CONNECTION POOLER
# (the pooler hosts are IPv4-reachable; the direct host db.<ref>.supabase.co:5432
# is IPv6-only and FAILS from Render with P1001). Copy both URLs from the
# Supabase dashboard ▸ Connect. No ?schema param — the app lives in `public`
# (baselined 2026-08-19; migration 20260819000000_init):
#
#   DATABASE_URL — TRANSACTION pooler (runtime queries): port 6543, ?pgbouncer=true
#     postgresql://postgres.xhdhhanmqtrnblequgiy:<PASSWORD>@aws-0-us-east-1.pooler.supabase.com:6543/postgres?pgbouncer=true
#   DIRECT_URL — SESSION pooler (used only by `prisma migrate deploy`): port 5432
#     postgresql://postgres.xhdhhanmqtrnblequgiy:<PASSWORD>@aws-0-us-east-1.pooler.supabase.com:5432/postgres
#
# NOTE: the `public` schema of this Supabase project ALSO holds tables belonging
# to another app (agent_status, conversations, memory, tasks, …). They coexist
# fine with the My Favor tables — never wipe/reset the public schema wholesale.

services:
  - type: web
    name: my-favor-api
    runtime: docker
    plan: starter         # ~$7/mo, stays warm (avoid the free tier's cold starts for a real app)
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app reads process.env.PORT.
      - key: OTP_DEV_RETURN        # MUST be false in production (server refuses to boot otherwise)
        value: "false"
      # ---- Set these in the Render dashboard (sync: false keeps them out of git) ----
      - key: DATABASE_URL          # Supabase TRANSACTION pooler URL (port 6543, ?pgbouncer=true) — see header
        sync: false
      - key: DIRECT_URL            # Supabase SESSION pooler URL (port 5432) — migrations only, see header
        sync: false
      - key: JWT_ACCESS_SECRET     # long random string (≥32 chars); must differ from the refresh secret
        sync: false
      - key: JWT_REFRESH_SECRET    # long random string (≥32 chars); must differ from the access secret
        sync: false
      - key: CORS_ORIGINS          # your app/web origins, comma-separated (never *)
        sync: false
      - key: STRIPE_SECRET_KEY     # sk_live_… (or sk_test_… while testing)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # whsec_… from your Stripe webhook endpoint
        sync: false
      - key: RESEND_API_KEY        # email provider for OTP codes
        sync: false
      - key: OTP_FROM_EMAIL        # verified sender, e.g. My Favor <noreply@yourdomain.com>
        sync: false
      # NOTE: STRIPE_PUBLISHABLE_KEY and GOOGLE_MAPS_API_KEY are CLIENT-side vars
      # (EXPO_PUBLIC_* in the EAS build environment) — the server never reads
      # them, so they are intentionally not declared here.
